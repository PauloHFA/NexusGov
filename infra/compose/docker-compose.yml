version: '3.8'

services:
  nexus-db:
    image: postgres:16-alpine
    container_name: nexusgov-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexusgov
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexusgov"]
      interval: 5s
      timeout: 5s
      retries: 5

  nexus-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nexusgov-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: nexus
      RABBITMQ_DEFAULT_PASS: nexus_rabbit_password
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  nexus-minio:
    image: minio/minio:latest
    container_name: nexusgov-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexusminio
      MINIO_ROOT_PASSWORD: nexus_minio_password
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  nexus-backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: nexusgov-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://nexus-db:5432/nexusgov
      SPRING_DATASOURCE_USERNAME: nexus
      SPRING_DATASOURCE_PASSWORD: nexus_dev_password
      RABBITMQ_HOST: nexus-rabbitmq
    ports:
      - "8080:8080"
    depends_on:
      nexus-db:
        condition: service_healthy
      nexus-rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  nexus-frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: nexusgov-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - nexus-backend

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
