[project]
name = "nexusgov-ingestion"
version = "0.1.0"
description = "Módulo de Ingestão e ETL de Dados PNCP, Receita Federal e IBGE do NexusGov"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "pika>=1.3.2",
    "pydantic>=2.8.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0"
]
